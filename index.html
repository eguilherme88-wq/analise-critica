<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner — Análise Crítica da Diretoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F6F9; --panel:#FFFFFF; --ink:#1B2533; --muted:#667085; --line:#E4E7EC; --line2:#F0F2F5;
  --primary:#1F4E79; --primary-ink:#FFFFFF; --primary-soft:#E8EFF7; --primary-hover:#173D60;
  --ok:#1E7B4A; --ok-soft:#E6F4EC; --warn:#B26B00; --warn-soft:#FDF2E0; --bad:#B42318; --bad-soft:#FDECEA;
  --none:#EAECF0; --side:#FFFFFF; --side-ink:#475467; --side-active:#1F4E79; --shadow:0 1px 2px rgba(16,24,40,.05);
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --panel:#161D27; --ink:#E7ECF2; --muted:#98A2B3; --line:#263140; --line2:#1D2632;
    --primary:#6FA3D6; --primary-ink:#0E131B; --primary-soft:#1B2A3B; --primary-hover:#8AB6E0;
    --ok:#4CC38A; --ok-soft:#15291F; --warn:#E6A23C; --warn-soft:#2E2414; --bad:#F07167; --bad-soft:#331A1A;
    --none:#222C39; --side:#121821; --side-ink:#98A2B3; --side-active:#8AB6E0; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --panel:#161D27; --ink:#E7ECF2; --muted:#98A2B3; --line:#263140; --line2:#1D2632;
  --primary:#6FA3D6; --primary-ink:#0E131B; --primary-soft:#1B2A3B; --primary-hover:#8AB6E0;
  --ok:#4CC38A; --ok-soft:#15291F; --warn:#E6A23C; --warn-soft:#2E2414; --bad:#F07167; --bad-soft:#331A1A;
  --none:#222C39; --side:#121821; --side-ink:#98A2B3; --side-active:#8AB6E0; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:600;line-height:1.25;margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.05rem} h3{font-size:.95rem}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
nav.side{background:var(--side);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.brand .logo{width:36px;height:36px;border-radius:8px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.brand b{display:block;font-size:.92rem;color:var(--ink);line-height:1.2}
.brand small{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.navlabel{font-size:.72rem;color:var(--muted);padding:10px 12px 4px;font-weight:500}
nav.side button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;color:var(--side-ink);display:flex;gap:10px;align-items:center;font-weight:500}
nav.side button svg{width:18px;height:18px;flex:none;opacity:.8}
nav.side button:hover{background:var(--line2)}
nav.side button.on{background:var(--primary-soft);color:var(--side-active)}
nav.side button.on svg{opacity:1}
nav.side button .badge{margin-left:auto}
.badge{font-size:.7rem;background:var(--bad);color:#fff;border-radius:10px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;font-size:.75rem;padding:12px;color:var(--muted);border-top:1px solid var(--line)}
.topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,32px);position:sticky;top:0;z-index:10}
.crumb{font-size:.85rem;color:var(--muted)} .crumb b{color:var(--ink);font-weight:600}
.topbar .meta{font-size:.8rem;color:var(--muted)}
.content{min-width:0;display:flex;flex-direction:column}
main{padding:24px clamp(16px,3vw,32px) 60px;min-width:0;max-width:1400px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;box-shadow:var(--shadow);font-size:.875rem}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.pri:hover{background:var(--primary-hover)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.ghost{background:none;border-color:transparent;color:var(--primary);box-shadow:none}
.btn.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel > h2,.panel > h3{margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);position:relative}
.kpi::before{content:"";position:absolute;left:18px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.kpi span{display:block;color:var(--muted);font-size:.8rem;padding-left:16px;font-weight:500}
.kpi b{display:block;font-size:1.9rem;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.kpi.ok::before{background:var(--ok)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)} .kpi.pri::before{background:var(--primary)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
thead th{font-size:.75rem;color:var(--muted);font-weight:600;background:var(--line2);border-bottom:1px solid var(--line)}
thead th:first-child{border-top-left-radius:6px} thead th:last-child{border-top-right-radius:6px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--primary-soft)}
.heat{border-collapse:separate;border-spacing:4px;width:auto;min-width:100%}
.heat th,.heat td{border:0;padding:0;background:none}
.heat thead th{background:none}
.heat th.m{text-align:center;font-weight:500;padding:0 0 4px;min-width:56px}
.heat td.name{padding:6px 16px 6px 0;min-width:230px;max-width:320px}
.heat td.name b{display:block;font-weight:600;font-size:.88rem}
.heat td.name span{font-size:.75rem;color:var(--muted)}
.cell{display:flex;align-items:center;justify-content:center;height:40px;border-radius:6px;font-weight:600;font-size:.8rem;background:var(--none);color:var(--muted);border:1px solid transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.cell.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.cell.cur{box-shadow:0 0 0 2px var(--primary)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:.74rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--none);color:var(--muted)} .pill.pri{background:var(--primary-soft);color:var(--primary)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--ink);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%;font-weight:400;box-shadow:var(--shadow)}
input:focus,select:focus,textarea:focus,input[type=password]:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:70px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.full{grid-column:1/-1}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.entrada{border-top:1px solid var(--line2);padding:16px 0}
.entrada:first-of-type{border-top:0;padding-top:0}
.entrada h3{margin-bottom:2px}
.entrada p{margin:0 0 8px;font-size:.8rem;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--panel);border-radius:12px;padding:24px;width:100%;max-width:720px;border:1px solid var(--line);box-shadow:0 20px 40px rgba(16,24,40,.2)}
.modal h2{margin-bottom:16px;font-size:1.15rem}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)}
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:.85rem;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.note{background:var(--primary-soft);border-left:3px solid var(--primary);border-radius:6px;padding:10px 14px;font-size:.84rem;margin-bottom:18px}
.ata{line-height:1.65;max-width:820px}
.ata h1{font-size:1.3rem}
.ata h2{margin:24px 0 8px;font-size:.95rem;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ata table{font-size:.8rem}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.results-grid label.lk{color:var(--muted)}.results-grid label.lk .ic{width:12px;height:12px;margin-left:4px;vertical-align:-1px}.results-grid input:disabled{background:var(--line2);color:var(--muted);cursor:not-allowed}
.results-grid label{font-size:.78rem;color:var(--muted);font-weight:500}
.check{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:8px}
.mobile-nav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  .topbar{display:none}
  .mobile-nav{display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;gap:8px}
  .mobile-nav button{background:none;border:0;color:var(--side-ink);padding:8px 12px;white-space:nowrap;border-radius:6px;display:flex;gap:6px;align-items:center;font-weight:500}
  .mobile-nav button svg{display:none}
  .mobile-nav button.on{color:var(--side-active);background:var(--primary-soft);font-weight:600}
  main{padding-top:18px}
}

input[type=search],input[type=time],input[type=password]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%;font-weight:400;box-shadow:var(--shadow)}
.topbar .meta{display:flex;align-items:center;gap:6px}
.topbar .date{margin-right:8px;text-transform:none}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;color:var(--ink);padding:0}
.icon-btn:hover{background:var(--line2)}
.icon-btn svg{width:18px;height:18px}
.mtools{margin-left:auto;display:flex;gap:6px;padding-left:8px}
.mobile-nav .icon-btn svg{display:block}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.filters label.f{min-width:150px;flex:0 1 190px}
.filters label.grow{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.85rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.legend-only{padding:10px 16px}
.legend-only .legend{margin:0;padding:0;border:0}
.legend i.dash{width:18px;height:0;border-top:2px dashed var(--ink);border-radius:0;vertical-align:3px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:16px}
.ind-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.ind-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ind-top h3{margin-bottom:2px}
.ind-val{text-align:right;white-space:nowrap}
.ind-val b{font-size:1.35rem;letter-spacing:-.02em}
.ind-actions{justify-content:space-between;border-top:1px solid var(--line2);padding-top:10px;margin-top:auto}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.chk:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.chk input{margin-top:3px}
.chk b{display:block;font-weight:600;font-size:.88rem}
.chk small{color:var(--muted);font-size:.78rem}
.ata-wrap{overflow-x:auto;padding-bottom:8px}
body.fs .app{grid-template-columns:1fr}
body.fs nav.side{display:none}
body.fs main{max-width:none}
@media (max-width:860px){body.fs .mobile-nav{display:flex}}

.ic{width:16px;height:16px;flex:none;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;gap:6px}
.btn .ic{width:16px;height:16px}
.btn.sm .ic{width:14px;height:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg button{display:inline-flex;align-items:center;gap:6px}
.pill .ic{width:13px;height:13px;vertical-align:0}
.pill::before{display:none}
.kpi::before{display:none}
.kpi{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}
.kpi span:not(.kic){padding-left:0;grid-column:2}
.kpi b{grid-column:2;margin-top:0}
.kic{grid-row:1/3;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--none);color:var(--muted)}
.kic .ic{width:24px;height:24px}
.kpi.ok .kic{background:var(--ok-soft);color:var(--ok)} .kpi.warn .kic{background:var(--warn-soft);color:var(--warn)} .kpi.bad .kic{background:var(--bad-soft);color:var(--bad)} .kpi.pri .kic{background:var(--primary-soft);color:var(--primary)}
.hi{display:flex;align-items:center;gap:8px}
.hi .ic{width:20px;height:20px;color:var(--primary)}
.picto{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary);position:relative}
.picto .ic{width:21px;height:21px}
.picto::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--panel);background:var(--none)}
.picto.ok::after{background:var(--ok)} .picto.warn::after{background:var(--warn)} .picto.bad::after{background:var(--bad)}
.picto:not(.ok):not(.warn):not(.bad)::after{display:none}
.ind-name,.nm{display:flex;gap:12px;align-items:center;min-width:0}
.nm{cursor:pointer;border-radius:8px}
.nm:hover b{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.heat td.name .nm span{display:block}
.chart-zoom{position:relative;cursor:zoom-in;border-radius:8px;padding:4px;margin:-4px;transition:background .15s}
.chart-zoom:hover{background:var(--line2)}
.zoom-hint{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;color:var(--primary);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px 10px;opacity:0;transition:opacity .15s;pointer-events:none}
.zoom-hint .ic{width:13px;height:13px}
.chart-zoom:hover .zoom-hint,.chart-zoom:focus-visible .zoom-hint{opacity:1}
.search{position:relative;display:block}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px!important}
.modal-bg.center{align-items:center}
.modal.lg{outline:none;max-width:1120px;padding:18px 24px;max-height:calc(100vh - 24px);overflow-y:auto;animation:zin .18s ease-out}
@keyframes zin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.zhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:12px}
.modal-bg.center{padding:12px}
.modal.lg .legend{margin-top:8px;padding-top:8px}
.modal.lg .actions{margin-top:12px;padding-top:12px}
.zhead .picto{width:46px;height:46px}.zhead .picto .ic{width:26px;height:26px}
.zstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.zstat{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.zstat span{display:block;font-size:.75rem;color:var(--muted);font-weight:500}
.zstat b{display:block;font-size:1.05rem;letter-spacing:-.01em}
.zstat b small{font-size:.75rem;color:var(--muted);font-weight:500}
.zstat>div>small{display:block;font-size:.74rem;color:var(--muted)}
.zic{width:32px;height:32px;border-radius:10px;display:grid!important;place-items:center;flex:none;background:var(--none);color:var(--muted)}
.zic .ic{width:20px;height:20px}
.zstat.ok .zic{background:var(--ok-soft);color:var(--ok)} .zstat.warn .zic{background:var(--warn-soft);color:var(--warn)} .zstat.bad .zic{background:var(--bad-soft);color:var(--bad)} .zstat.pri .zic{background:var(--primary-soft);color:var(--primary)}
.zchart{border:1px solid var(--line2);border-radius:10px;padding:10px 6px 4px;background:var(--panel)}
.ztable th,.ztable td{text-align:center;white-space:nowrap;padding:6px;font-size:.8rem}
.ztable td:first-child,.ztable th:first-child{text-align:left}
.ztable th.cur{color:var(--primary)}
.zc{font-weight:600}
.zc .ic{width:13px;height:13px;margin-right:3px;vertical-align:-2px}
.zc.ok{color:var(--ok)} .zc.warn{color:var(--warn)} .zc.bad{color:var(--bad)} .zc.none{color:var(--muted)}
.zc.cur{background:var(--primary-soft);border-radius:6px}
@media (max-width:700px){.modal.lg{padding:18px 14px}.modal-bg{padding:16px 8px}}
@media (prefers-reduced-motion:reduce){.modal.lg{animation:none}}

<script>
(function(){
"use strict";

/* ---------- Tema (antes de tudo, para não piscar) ---------- */
try{const t=localStorage.getItem("ac-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}

/* ---------- Constantes ---------- */
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const ENTRADAS=[

const SAIDAS=[
  ["melhorias","Oportunidades de melhoria","9.3.3 a"],
  ["mudancas","Necessidade de mudanças no sistema de gestão","9.3.3 b"],
  ["recursos","Necessidade de recursos","9.3.3 c"]

const STATUS_ACAO={aberta:"Aberta",andamento:"Em andamento",concluida:"Concluída",cancelada:"Cancelada"};
const EFICACIA={pendente:"A verificar",eficaz:"Eficaz",nao_eficaz:"Não eficaz"};
const HEX={ok:"#1E7B4A",warn:"#B26B00",bad:"#B42318",none:"#D0D5DD",ink:"#1B2533",muted:"#667085",line:"#E4E7EC",band:"#FDF2E0",cur:"#1F4E79"};
const VARS={ok:"var(--ok)",warn:"var(--warn)",bad:"var(--bad)",none:"var(--none)",ink:"var(--ink)",muted:"var(--muted)",line:"var(--line)",band:"var(--warn-soft)",cur:"var(--primary)"};

/* ---------- Estado ---------- */

  fProc:"",fInd:"",fSit:"",busca:"",indModo:"graficos"};

function mesAtual(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hoje(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtData(s){if(!s)return "—";const [y,m,d]=s.split("-");return d?`${d}/${m}/${y}`:s;}
function fmtMes(p){if(!p)return "";const [y,m]=p.split("-");return MESES[+m-1]+"/"+y.slice(2);}
function fmtNum(v){if(v===""||v==null||isNaN(v))return "—";return Number(v).toLocaleString("pt-BR",{maximumFractionDigits:2});}
function fmtCompact(v){if(v==null||isNaN(v))return "";const a=Math.abs(v);if(a<10000)return fmtNum(v);return Number(v).toLocaleString("pt-BR",{notation:"compact",maximumFractionDigits:1});}
function ultimosMeses(p,n){const [y,m]=p.split("-").map(Number);const out=[];for(let i=n-1;i>=0;i--){const d=new Date(y,m-1-i,1);out.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));}return out;}
function list(col){return Object.values(S[col]);}
function toast(msg){let box=document.getElementById("toasts");if(!box){box=document.createElement("div");box.id="toasts";document.body.appendChild(box);}const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;box.appendChild(t);setTimeout(()=>t.remove(),2600);}
function cfg(){return S.config.geral||{id:"geral",empresa:"",codigoAta:"RG-SGQ-001",revisao:"00"};}
function funcs(ativos){return list("funcionarios").filter(f=>!ativos||f.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome));}
function func(id){return id&&S.funcionarios[id];}
function sortInd(a,b){return (a.processo||"").localeCompare(b.processo||"")||a.nome.localeCompare(b.nome);}
function metaTxt(i){return `${i.sentido==="menor"?"≤":"≥"} ${fmtNum(i.meta)} ${i.unidade||""}`.trim();}

/* ---------- Persistência ---------- */
const LS_KEY="analise-critica-v1";
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(r){for(const c in S)S[c]=r[c]||{};}}catch(e){}}
async function put(col,obj){
  const data=JSON.parse(JSON.stringify(obj)); delete data.id;
  S[col][obj.id]={...data,id:obj.id};
  if(db){try{await db.collection(col).doc(obj.id).set(data);}catch(e){handleDbError(e);}}
  else saveLocal();
}
async function remove(col,id){
  delete S[col][id];
  if(db){try{await db.collection(col).doc(id).delete();}catch(e){handleDbError(e);}}
  else saveLocal();
}
function handleDbError(e){
  const code=e&&e.code;
  if(code==="invalid_argument")toast("Você tem acesso somente de leitura a estes dados.");
  else if(code==="quota_exceeded")toast("Limite de registros atingido. Exclua itens antigos para continuar.");
  else toast("Não foi possível salvar agora. Tente de novo em instantes.");
  scheduleRender();
}
const pending={};
function debounceSave(col,obj,ms=700){
  const k=col+"/"+obj.id; clearTimeout(pending[k]);
  S[col][obj.id]=obj;
  pending[k]=setTimeout(()=>{delete pending[k];put(col,S[col][obj.id]);},ms);
}
async function init(){
  loadLocal(); render();
  const C=window.claude;
  if(!C||typeof C.use!=="function")return;
  try{db=await C.use("db");}catch(e){db=null;}
  if(!db){pronto=true;render();}
  try{downloads=await C.use("downloads");}catch(e){downloads=null;}
  if(db){
    for(const col of Object.keys(S)){
      db.collection(col).limit(1000).onSnapshot(snap=>{
        const next={};
        snap.docs.forEach(d=>{next[d.id]={...d.data(),id:d.id};});
        for(const k in pending){const [c,id]=k.split("/");if(c===col&&S[col][id])next[id]=S[col][id];}
        S[col]=next; if(col==="funcionarios"&&!pronto){pronto=true;render();} scheduleRender();
      },err=>{console.warn(col,err);});
    }
  }
  scheduleRender();
}
function scheduleRender(){
  if(renderQueued)return; renderQueued=true;
  requestAnimationFrame(()=>{renderQueued=false;
    const a=document.activeElement;
    const typing=a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"));
    if(modalOpen||typing){if(UI.authMode==null&&eu())renderNav();return;}
    render();
  });
}

/* ---------- Regras dos indicadores ---------- */
function faixa(ind){
  const meta=+ind.meta, tol=Math.abs(+ind.tolerancia||0)/100;
  return ind.sentido==="menor"?[meta,meta*(1+tol)]:[meta*(1-tol),meta];
}
function statusValor(ind,v){
  if(v===""||v==null||isNaN(v))return "none";
  v=+v; const meta=+ind.meta; const [lo,hi]=faixa(ind);
  if(ind.sentido==="menor"){if(v<=meta)return "ok";if(v<=hi)return "warn";return "bad";}
  if(v>=meta)return "ok"; if(v>=lo)return "warn"; return "bad";
}
const ST_LABEL={ok:"Atingido",warn:"Em alerta",bad:"Não atingido",none:"Sem dado"};
function valorPeriodo(ind,p){const r=ind.resultados||{};return r[p];}
function acaoAtrasada(a){return (a.status==="aberta"||a.status==="andamento")&&a.quando&&a.quando<hoje();}
function acoesAbertas(){return list("acoes").filter(a=>a.status==="aberta"||a.status==="andamento");}

function pictoNome(i){
  const t=norm(i.nome+" "+(i.processo||"")+" "+(i.unidade||""));
  const R=[[/acident|segur|incidente|sst/,"shield"],[/manuten|equipament|quebra|mtbf|mttr/,"wrench"],[/treina|capacit|horas de forma/,"grad"],[/absente|turnover|rotativ|recursos humanos|\brh\b|colaborador/,"person"],[/receita|fatur|custo|lucro|venda|r\$|margem|orcament/,"dollar"],[/satisf|reclama|cliente|nps/,"smile"],[/entrega|logist|prazo|transport|frete/,"truck"],[/fornece|compra|suprim/,"box"],[/refugo|produc|retrabalho|perda|defeito|nao conform/,"factory"],[/ambient|residuo|energia|agua|emiss/,"leaf"]];
  for(const [re,n] of R)if(re.test(t))return n;
  return "gauge";
}

/* ---------- Filtro de indicadores ---------- */

    (!UI.fInd||i.id===UI.fInd)&&
    (!UI.fSit||statusValor(i,valorPeriodo(i,periodo||UI.periodo))===UI.fSit)&&
    (!b||(i.nome+" "+(i.processo||"")+" "+(i.responsavel||"")).toLowerCase().includes(b))
  ).sort(sortInd);
}
function filtroBar(){
  const inds=indsV().sort(sortInd);

  return `<div class="filters ${UI.filtrosAbertos?"open":""}">

/* ---------- Gráfico com critério de semáforo ---------- */
function chartSVG(ind,meses,pal,curP,o){
  pal=pal||VARS; o=o||{}; const F=o.F||1;
  const W=o.W||640,H=o.H||220,pl=48*F,pr=62*F,pt=26*F,pb=32*F;
  const vals=meses.map(p=>{const v=valorPeriodo(ind,p);return v===""||v==null||isNaN(v)?null:+v;});
  const nums=vals.filter(v=>v!=null);
  const meta=+ind.meta; const [lo,hi]=faixa(ind);
  let maxV=Math.max(0,meta,hi,...nums); let minV=Math.min(0,...nums);
  if(maxV===minV)maxV=minV+1;
  const raw=(maxV-minV)/5, mag=Math.pow(10,Math.floor(Math.log10(raw))), nrm=raw/mag;
  const stepV=(nrm<=1?1:nrm<=2?2:nrm<=2.5?2.5:nrm<=5?5:10)*mag;
  minV=Math.floor(minV/stepV)*stepV; maxV=Math.ceil(maxV*1.08/stepV)*stepV; if(maxV<=minV)maxV=minV+stepV;
  const y=v=>pt+(H-pt-pb)*(1-(v-minV)/(maxV-minV));
  const step=(W-pl-pr)/meses.length, bw=Math.min(40*F*1.3,step*0.62);
  let g=""; const fx=Math.min(10.5*F,step/3.4), fv=Math.min(10.5*F,step/3.1);
  for(let v=minV;v<=maxV+stepV/2;v+=stepV){const yy=y(v);
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${pal.line}" stroke-width="1"/><text x="${pl-8*F}" y="${yy+3.5*F}" text-anchor="end" font-size="${10*F}" fill="${pal.muted}">${fmtCompact(Math.round(v*1000)/1000)}</text>`;}
  if(hi>lo){const y1=y(hi),y2=y(lo);g+=`<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${Math.max(0,y2-y1)}" fill="${pal.band}" opacity=".85"/>`;}
  const base=y(Math.max(minV,0));
  meses.forEach((p,k)=>{
    const cx=pl+step*k+step/2, v=vals[k];
    if(v==null){g+=`<line x1="${cx-bw/2}" x2="${cx+bw/2}" y1="${base}" y2="${base}" stroke="${pal.none}" stroke-width="3"/><text x="${cx}" y="${base-6*F}" text-anchor="middle" font-size="${10*F}" fill="${pal.muted}">—</text>`;}
    else{const st=statusValor(ind,v);const yv=y(v);const h=Math.max(4*F,Math.abs(base-yv)),top=yv<=base?Math.min(yv,base-h):base;
      g+=`<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${h}" rx="${3*F}" fill="${pal[st]}"><title>${fmtMes(p)}: ${fmtNum(v)} — ${ST_LABEL[st]}</title></rect><text x="${cx}" y="${top-5*F}" text-anchor="middle" font-size="${fv}" font-weight="600" fill="${pal[st]}">${fmtCompact(v)}</text>`;}
    g+=`<text x="${cx}" y="${H-10*F}" text-anchor="middle" font-size="${fx}" fill="${p===curP?pal.ink:pal.muted}" font-weight="${p===curP?700:400}">${fmtMes(p)}</text>`;
  });
  const ym=y(meta);
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${ym}" y2="${ym}" stroke="${pal.ink}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr+6*F}" y="${ym-2*F}" font-size="${10.5*F}" font-weight="700" fill="${pal.ink}">Meta</text><text x="${W-pr+6*F}" y="${ym+11*F}" font-size="${10.5*F}" fill="${pal.ink}">${fmtCompact(meta)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de ${esc(ind.nome)}" style="display:block;font-family:inherit">${g}</svg>`;
}

const MATRIZ_PADRAO={master:{painel:2,indicadores:2,resultados:3,reunioes:2,acoes:2,funcionarios:1,empresa:1},usuario:{painel:1,indicadores:1,resultados:2,reunioes:1,acoes:2,funcionarios:0,empresa:0}};

function eu(){const f=UI.me&&S.funcionarios[UI.me];return f&&f.ativo!==false&&f.nivel&&f.senhaHash?f:null;}
function isAdmin(){const f=eu();return !!f&&f.nivel==="administrador";}
function matriz(){const m=S.config.acessos||{};return {master:{...MATRIZ_PADRAO.master,...(m.master||{})},usuario:{...MATRIZ_PADRAO.usuario,...(m.usuario||{})}};}
function nivelMod(mod){const f=eu();if(!f)return 0;if(f.nivel==="administrador")return 3;const v=+((matriz()[f.nivel]||{})[mod])||0;return f.nivel==="usuario"&&mod==="indicadores"?Math.min(v,1):v;}
function opcoesMod(k,n){if(k==="indicadores"&&n==="usuario")return NIV_ACESSO.slice(0,2);return k==="resultados"?["Sem acesso","Visualizar","Lançar (sem alterar)","Lançar e alterar"]:NIV_ACESSO;}
function pode(mod,n){return nivelMod(mod)>=(n||1);}
function podeArea(proc){const f=eu();if(!f)return false;if(f.nivel==="administrador")return true;const a=f.areas||["*"];return a.includes("*")||a.includes(proc||"");}
function indsV(){return list("indicadores").filter(i=>podeArea(i.processo));}
function acaoVisivel(a){const f=eu();if(!f)return false;if(f.nivel==="administrador")return true;const i=a.indicadorId&&S.indicadores[a.indicadorId];if(!i)return true;return podeArea(i.processo)||norm(a.quem)===norm(f.nome);}
function processos(){return [...new Set(list("indicadores").map(i=>i.processo).filter(Boolean))].sort();}
function areasTxt(f){if(!f||!f.nivel)return "—";if(f.nivel==="administrador")return "Todas as áreas";const a=f.areas||["*"];return a.includes("*")?"Todas as áreas":a.length?a.join(", "):"Nenhuma área";}
function iniciais(n){return String(n||"?").trim().split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join("").toUpperCase();}
function temAdmin(){return list("funcionarios").some(f=>f.nivel==="administrador"&&f.senhaHash&&f.ativo!==false);}
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");}
function novoSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return hex(a);}
async function hashSenha(senha,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error("cripto");
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:120000,hash:"SHA-256"},k,256);
  return hex(bits);
}
async function sha256(t){return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)));}
async function conferirSenha(f,senha){if(!f||!f.senhaHash||!senha)return false;try{return (await hashSenha(senha,f.salt))===f.senhaHash;}catch(e){return false;}}
function fmtCodigo(h){return String(h||"").slice(0,16).toUpperCase().match(/.{4}/g).join("-");}
function fmtDataHora(iso){if(!iso)return "—";const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function signatarios(r){return [...new Set([...(r.participantesIds||[]),r.elaboradoPor,r.aprovadoPor].filter(Boolean))].filter(id=>S.funcionarios[id]);}
function assin(rid,fid){return S.assinaturas[rid+"__"+fid];}
function statusAssin(r){const ids=r.signatarios||[];const ok=ids.filter(id=>assin(r.id,id)).length;return {total:ids.length,ok,completa:ids.length>0&&ok===ids.length};}
function pendentesMinhas(){const f=eu();if(!f)return [];return list("reunioes").filter(r=>r.status==="concluida"&&(r.signatarios||[]).includes(f.id)&&!assin(r.id,f.id)).sort((a,b)=>(b.data||"").localeCompare(a.data||""));}
function textoAta(r){const d=document.createElement("div");d.innerHTML=ataHtml(r,{semAssinaturas:true});return d.textContent.replace(/\s+/g," ").trim();}
function statusReuniaoPill(x){
  if(x.status!=="concluida")return `<span class="pill pri">${ic("clock")}Em preparação</span>`;
  const s=statusAssin(x);
  if(!s.total)return `<span class="pill ok">${ic("ok")}Concluída</span>`;
  return s.completa?`<span class="pill ok">${ic("pen")}Assinada</span>`:`<span class="pill warn">${ic("pen")}Em assinatura ${s.ok}/${s.total}</span>`;
}

/* Logomarca */
function logoTag(cls){const l=cfg().logo;return l?`<img src="${l}" alt="Logomarca" class="${cls||""}">`:"";}
function marcaBox(){const c=cfg();return c.logo?`<div class="logo img">${logoTag()}</div>`:`<div class="logo">${esc(sigla(c.empresa))}</div>`;}
function carregarLogo(file){
  return new Promise((res,rej)=>{
    if(!file)return rej(new Error("vazio"));
    if(!/^image\//.test(file.type))return rej(new Error("tipo"));
    if(file.size>8*1024*1024)return rej(new Error("grande"));
    const fr=new FileReader();fr.onerror=()=>rej(new Error("leitura"));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("imagem"));im.onload=()=>{
      const W=im.naturalWidth||im.width||400,H=im.naturalHeight||im.height||160;const k=Math.min(1,480/W,200/H);
      const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(W*k));cv.height=Math.max(1,Math.round(H*k));
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      let url=cv.toDataURL("image/png");if(url.length>200000)url=cv.toDataURL("image/jpeg",0.85);res(url);};im.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

/* Canvas de assinatura */
function padInit(cv){
  const ctx=cv.getContext("2d");ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#16243A";
  let on=false,last=null;const st={sujo:false,ctx,limpar(){ctx.clearRect(0,0,cv.width,cv.height);st.sujo=false;}};
  const pos=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height];};
  cv.addEventListener("pointerdown",e=>{on=true;last=pos(e);try{cv.setPointerCapture(e.pointerId);}catch(x){}st.sujo=true;});
  cv.addEventListener("pointermove",e=>{if(!on)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});
  ["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>{on=false;}));
  return st;
}
async function desenharNome(ctx,cv,nome){
  try{await document.fonts.load('72px "Great Vibes"');}catch(e){}
  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle="#16243A";let fs=76;
  do{ctx.font=`${fs}px "Great Vibes","Brush Script MT","Segoe Script",cursive`;fs-=4;}while(ctx.measureText(nome).width>cv.width-40&&fs>20);
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(nome,cv.width/2,cv.height/2+6);
}
function recortar(cv){
  const ctx=cv.getContext("2d");const {width:w,height:h}=cv;const d=ctx.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return null;
  const p=8;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
  const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL("image/png");
}
async function assinaturaDigitada(nome){const cv=document.createElement("canvas");cv.width=600;cv.height=190;await desenharNome(cv.getContext("2d"),cv,nome);return recortar(cv);}

function authErr(t){const e=document.getElementById("au-err");if(e)e.textContent=t||"";}
function bindAuth(modo){
  const a=document.getElementById("auth");
  const enter=fn=>a.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")fn();}));
  if(modo==="login"){a.querySelector("#lg-go").onclick=doLogin;enter(doLogin);setTimeout(()=>{const u=a.querySelector("#lg-user");if(u)u.focus();},30);}
  if(modo==="setup"){const sel=a.querySelector("#su-func");const nv=a.querySelector("#su-novo");if(sel)sel.onchange=()=>{nv.hidden=!!sel.value;};a.querySelector("#su-go").onclick=doSetup;enter(doSetup);}

function entrar(f){
  UI.me=f.id;try{sessionStorage.setItem("ac-sess",f.id);}catch(e){}
  UI.authMode=undefined;falhas=0;const p=pendentesMinhas().length;
  UI.view=p?"assinaturas":"painel";render();

async function doLogin(){
  if(Date.now()<bloqueioAte){authErr("Muitas tentativas. Aguarde alguns segundos.");return;}
  const u=norm(document.getElementById("lg-user").value.trim()),s=document.getElementById("lg-pass").value;
  const f=list("funcionarios").find(x=>x.login&&norm(x.login)===u&&x.ativo!==false&&x.nivel);
  authErr("Verificando…");
  const ok=f&&await conferirSenha(f,s);
  if(!ok){falhas++;if(falhas>=5){bloqueioAte=Date.now()+30000;falhas=0;}authErr(window.crypto&&crypto.subtle?"Login ou senha incorretos.":"Este navegador não permite a verificação de senha nesta página.");return;}
  entrar(f);
}
async function doSetup(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:"";};
  const sel=g("su-func"),login=g("su-login").trim(),senha=g("su-senha"),conf=g("su-conf");
  if(!sel&&!g("su-nome").trim())return authErr("Informe o nome do administrador.");
  if(!login)return authErr("Informe o login.");
  if(senha.length<6)return authErr("A senha precisa ter pelo menos 6 caracteres.");
  if(senha!==conf)return authErr("As senhas não conferem.");
  if(list("funcionarios").some(x=>x.login&&norm(x.login)===norm(login)&&x.id!==sel))return authErr("Este login já está em uso.");
  let salt,hash;try{salt=novoSalt();hash=await hashSenha(senha,salt);}catch(e){return authErr("Este navegador não permite criar senha nesta página.");}
  const f=sel?{...S.funcionarios[sel]}:{id:uid(),nome:g("su-nome").trim(),cargo:g("su-cargo").trim(),setor:"",email:"",ativo:true};
  Object.assign(f,{nivel:"administrador",login,salt,senhaHash:hash,areas:["*"],ativo:true});
  await put("funcionarios",f);entrar(f);
}
function gate(){
  const modo=!pronto?"load":!temAdmin()?"setup":!eu()?"login":null;

  if(UI.authMode!==modo){UI.authMode=modo;a.innerHTML=authHtml(modo);bindAuth(modo);}
  return false;
}

async function concluirReuniao(r){
  const ids=signatarios(r);
  const semAcesso=ids.filter(id=>!S.funcionarios[id].senhaHash||!S.funcionarios[id].nivel);
  const msg=ids.length?`Concluir a reunião e enviar a ata para assinatura eletrônica de ${ids.length} pessoa${ids.length>1?"s":""}?${semAcesso.length?`\n\nAtenção: ${semAcesso.map(id=>S.funcionarios[id].nome).join(", ")} ainda não tem login no sistema. O administrador precisa criar o acesso para que possam assinar.`:""}`:"Concluir a reunião? Não há participantes cadastrados para assinar eletronicamente.";
  if(!confirm(msg))return;
  r.status="concluida";r.concluidaEm=new Date().toISOString();r.concluidaPor=UI.me;r.signatarios=ids;
  if(!r.slot)r.slot=slotParaData(r.data)||"";
  try{r.hashAta=await sha256(textoAta(r));}catch(e){r.hashAta="";}
  await put("reunioes",r);render();
  toast((ids.length?`Ata enviada para assinatura de ${ids.length} pessoa${ids.length>1?"s":""}`:"Reunião concluída")+(r.slot?` · vinculada ao calendário de ${fmtMes(r.slot)}`:""));
  const f=eu();if(f&&ids.includes(f.id)&&confirm("Você também é signatário. Deseja assinar agora?"))modalAssinar(r.id);
}

/* ---------- Tema e tela cheia ---------- */
function temaAtual(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
function alternarTema(){const n=temaAtual()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("ac-theme",n);}catch(e){}renderNav();}
async function alternarTelaCheia(){
  const on=!document.body.classList.contains("fs");
  document.body.classList.toggle("fs",on);
  try{
    if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else if(!on&&document.fullscreenElement)await document.exitFullscreen();
  }catch(e){}
  renderNav();
}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("fs")){document.body.classList.remove("fs");renderNav();}});

function sigla(t){if(!t)return "SG";const w=t.trim().split(/\s+/).filter(x=>x.length>2||/^[A-Z]/.test(x));return ((w[0]||"S")[0]+((w[1]||w[0]||"G")[w[1]?0:1]||"")).toUpperCase();}
document.addEventListener("click",e=>{
  const n=e.target.closest("[data-nav]");
  if(n){fecharMenu();UI.view=n.dataset.nav;render();window.scrollTo(0,0);return;}
  const t=e.target.closest("[data-tool]");
  if(t){const k=t.dataset.tool;if(k==="menu"){document.body.classList.toggle("drawer-open");renderNav();return;}if(k==="menu-close"){fecharMenu();return;}if(k!=="tema")fecharMenu();if(k==="tema")alternarTema();else if(k==="fs")alternarTelaCheia();else if(k==="sair")sair();else if(k==="conta")modalConta();else if(k==="sobre")modalSobre();return;}
  const me=e.target.closest("[data-me]");
  if(me){fecharMenu();if(me.dataset.me==="sair")sair();else modalConta();}
});

function render(){
  const a=document.activeElement; const fid=a&&a.id&&a.closest&&a.closest("#main")?a.id:null;
  let sel=null; try{if(fid&&a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd];}catch(e){}
  if(!gate())return;
  const perm=viewsPermitidas(); if(!perm[UI.view])UI.view=["painel","indicadores","reunioes","acoes","funcionarios"].find(k=>perm[k])||"assinaturas";
  renderNav();
  const m=document.getElementById("main");
  const v=UI.view;
  if(v==="painel")m.innerHTML=viewPainel();
  else if(v==="indicadores")m.innerHTML=viewIndicadores();
  else if(v==="reunioes")m.innerHTML=viewReunioes();
  else if(v==="reuniao")m.innerHTML=viewReuniao();
  else if(v==="acoes")m.innerHTML=viewAcoes();
  else if(v==="funcionarios")m.innerHTML=viewFuncionarios();
  else if(v==="assinaturas")m.innerHTML=viewAssinaturas();
  bindMain(); permGuard(m);
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
}

/* ---------- Painel ---------- */
function vazioInd(){return `<div class="empty"><h3>Nenhum indicador cadastrado</h3><p>Cadastre os indicadores do sistema de gestão para ver o semáforo e os gráficos.</p><button class="btn pri" data-act="novo-ind">${ic("plus")}Cadastrar indicador</button> <button class="btn" data-act="exemplo">${ic("table")}Carregar exemplo</button></div>`;}
function semFiltro(){return `<div class="empty"><h3>Nenhum indicador corresponde aos filtros</h3><button class="btn" data-act="limpar-filtros">Limpar filtros</button></div>`;}
function heatmap(periodo,inds,n=12){
  if(!indsV().length)return vazioInd();
  if(!inds.length)return semFiltro();
  const meses=ultimosMeses(periodo,n);
  return `<div class="scroll"><table class="heat"><thead><tr><th></th>${meses.map(p=>`<th class="m small muted">${fmtMes(p)}</th>`).join("")}</tr></thead><tbody>`+
  inds.map(ind=>`<tr><td class="name"><div class="nm" data-zoom="${ind.id}" data-per="${periodo}" role="button" tabindex="0" title="Ver gráfico ampliado">${picto(ind,statusValor(ind,valorPeriodo(ind,periodo)))}<div><b>${esc(ind.nome)}</b><span>${esc(ind.processo||"")} · meta ${esc(metaTxt(ind))}</span></div></div></td>`+
    meses.map(p=>{const v=valorPeriodo(ind,p);const st=statusValor(ind,v);
      return `<td><div class="cell ${st} ${p===periodo?"cur":""}" title="${esc(ind.nome)} — ${fmtMes(p)}: ${fmtNum(v)} (${ST_LABEL[st]})">${st==="none"?"·":fmtCompact(v)}</div></td>`;}).join("")+`</tr>`).join("")+
  `</tbody></table></div><div class="legend"><span><i style="background:var(--ok)"></i>Meta atingida</span><span><i style="background:var(--warn)"></i>Dentro da tolerância</span><span><i style="background:var(--bad)"></i>Meta não atingida</span><span><i style="background:var(--none)"></i>Sem resultado</span></div>`;
}
function viewPainel(){
  const inds=indsFiltrados();
  const cont={ok:0,warn:0,bad:0,none:0};
  inds.forEach(i=>cont[statusValor(i,valorPeriodo(i,UI.periodo))]++);
  const abertas=acoesAbertas().filter(acaoVisivel), atrasadas=abertas.filter(acaoAtrasada);
  const reun=list("reunioes").sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const prox=reun[0];
  return `${avisoPendentes()}<div class="head"><div><h1>Painel executivo</h1><p>Situação dos indicadores e das ações no período de referência.</p></div></div>
  ${filtroBar()}
  <div class="kpis">
    <div class="kpi ok"><span class="kic">${ic("ok")}</span><span>Meta atingida</span><b>${cont.ok}</b></div>
    <div class="kpi warn"><span class="kic">${ic("warn")}</span><span>Em alerta</span><b>${cont.warn}</b></div>
    <div class="kpi bad"><span class="kic">${ic("bad")}</span><span>Meta não atingida</span><b>${cont.bad}</b></div>
    <div class="kpi pri"><span class="kic">${ic("clipboard")}</span><span>Ações em aberto${atrasadas.length?` · ${atrasadas.length} atrasada${atrasadas.length>1?"s":""}`:""}</span><b>${abertas.length}</b></div>
  </div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 class="hi">${ic("traffic")}Semáforo dos indicadores — ${fmtMes(UI.periodo)}</h2>${cont.none&&inds.length?`<span class="small muted">${cont.none} sem resultado no período</span>`:""}</div>${heatmap(UI.periodo,inds,isMobile()?6:12)}</div>
  <div class="grid2">
    <div class="panel"><h3 class="hi">${ic("clock")}Ações atrasadas</h3>${atrasadas.length?`<table><tbody>${atrasadas.slice(0,8).map(a=>`<tr class="click" data-edit-acao="${a.id}"><td>${esc(a.oque)}<div class="small muted">${esc(a.quem||"sem responsável")}</div></td><td class="small" style="color:var(--bad);white-space:nowrap">${fmtData(a.quando)}</td></tr>`).join("")}</tbody></table>`:`<p class="muted small">Nenhuma ação atrasada.</p>`}</div>
    <div class="panel"><h3 class="hi">${ic("calendar")}Reuniões de análise crítica</h3>${(()=>{const px=proximaPrevista();return px?`<p class="small" style="margin:8px 0 0">${ic("flag")} Próxima prevista: <b>${fmtData(px.data)}</b> (${esc(FREQS[calCfg().frequencia][0].toLowerCase())})</p>`:"";})()}<p class="small muted" style="margin:10px 0 0">Última registrada:</p>${prox?`<p style="margin:8px 0 4px"><b>${esc(prox.titulo||"Análise crítica")}</b></p><p class="muted small" style="margin:0 0 12px">${fmtData(prox.data)} · ${prox.status==="concluida"?"Concluída":"Em preparação"}</p><button class="btn sm" data-open-reuniao="${prox.id}">${ic("file")}Abrir reunião</button>`:`<p class="muted small">Nenhuma reunião registrada.</p><button class="btn sm pri" data-act="nova-reuniao">${ic("calendar")}Agendar reunião</button>`}</div>
  </div>`;
}

/* ---------- Indicadores ---------- */
function cardIndicador(i,periodo,extra){
  const v=valorPeriodo(i,periodo); const st=statusValor(i,v);
  return `<div class="ind-card"><div class="ind-top"><div class="ind-name">${picto(i,st)}<div><h3>${esc(i.nome)}</h3><span class="small muted">${esc(i.processo||"—")} · ${esc(i.responsavel||"sem responsável")} · meta ${esc(metaTxt(i))}</span></div></div>
  <div class="ind-val"><b>${fmtNum(v)}</b> <span class="small muted">${esc(i.unidade||"")}</span><br>${pill(st)}</div></div>
  <div class="chart-zoom" data-zoom="${i.id}" data-per="${periodo}" role="button" tabindex="0" aria-label="Ampliar gráfico de ${esc(i.nome)}">${isMobile()?chartSVG(i,ultimosMeses(periodo,6),null,periodo,{W:360,H:200,F:1}):chartSVG(i,ultimosMeses(periodo,12),null,periodo)}<span class="zoom-hint">${ic("zoom")}Ampliar</span></div>${extra||""}</div>`;
}
function viewIndicadores(){
  const all=indsV(), f=indsFiltrados();
  const modo=UI.indModo;
  let body;
  if(!all.length)body=`<div class="panel">${vazioInd()}</div>`;
  else if(!f.length)body=`<div class="panel">${semFiltro()}</div>`;
  else if(modo==="graficos")body=`<div class="panel legend-only">${LEGENDA}</div><div class="ind-grid">${f.map(i=>cardIndicador(i,UI.periodo,`<div class="row ind-actions"><span class="small muted">${esc(i.frequencia||"Mensal")}${i.formula?` · ${esc(i.formula)}`:""}</span><span class="row"><button class="btn sm" data-lancar="${i.id}">${ic("table")}Lançar resultados</button><button class="btn sm ghost" data-edit-ind="${i.id}">${ic("edit")}Editar</button></span></div>`)).join("")}</div>`;
  else body=`<div class="panel scroll"><table><thead><tr><th>Indicador</th><th>Processo</th><th>Responsável</th><th>Meta</th><th>Resultado ${fmtMes(UI.periodo)}</th><th>Situação</th><th></th></tr></thead><tbody>`+
    f.map(i=>{const v=valorPeriodo(i,UI.periodo);const st=statusValor(i,v);
      return `<tr><td><div class="nm" data-zoom="${i.id}" data-per="${UI.periodo}" role="button" tabindex="0" title="Ver gráfico ampliado">${picto(i,st)}<div><b>${esc(i.nome)}</b><div class="small muted">${esc(i.frequencia||"Mensal")}</div></div></div></td><td>${esc(i.processo||"—")}</td><td>${esc(i.responsavel||"—")}</td><td style="white-space:nowrap">${esc(metaTxt(i))}</td><td>${fmtNum(v)}</td><td>${pill(st)}</td><td style="white-space:nowrap"><button class="btn sm" data-lancar="${i.id}">${ic("table")}Lançar resultados</button> <button class="btn sm ghost" data-edit-ind="${i.id}">${ic("edit")}Editar</button></td></tr>`;}).join("")+`</tbody></table></div>`;
  return `<div class="head"><div><h1>Indicadores</h1><p>Gráficos com o mesmo critério do semáforo: meta, faixa de tolerância e resultado mês a mês.</p></div>
  <div class="row"><div class="seg" role="group" aria-label="Modo de exibição"><button class="${modo==="graficos"?"on":""}" data-modo="graficos">${IC_BAR}Gráficos</button><button class="${modo==="tabela"?"on":""}" data-modo="tabela">${ic("table")}Tabela</button></div><button class="btn" data-act="relatorio">${ic("file")}Relatório</button><button class="btn pri" data-act="novo-ind">${ic("plus")}Novo indicador</button></div></div>

/* ---------- Calendário de análise crítica ---------- */
const FREQS={mensal:["Mensal",1],bimestral:["Bimestral",2],trimestral:["Trimestral",3],semestral:["Semestral",6],anual:["Anual",12]};
const MESES_LONGO=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const p2=n=>String(n).padStart(2,"0");
function inicioPadrao(){const ds=list("reunioes").map(r=>(r.data||"").slice(0,7)).filter(Boolean);return [...ds,mesAtual()].sort()[0];}
function calCfg(){const c={id:"calendario",frequencia:"trimestral",mesInicio:3,dia:15,hora:"09:00",local:"",ajustes:{},...(S.config.calendario||{})};if(!c.inicio)c.inicio=inicioPadrao();return c;}
function passo(){return (FREQS[calCfg().frequencia]||FREQS.trimestral)[1];}
function slotsAno(y){
  const c=calCfg(),st=passo(),out=[];
  for(let m=1;m<=12;m++){if(((m-(+c.mesInicio||1))%st+st)%st!==0)continue;
    if(`${y}-${p2(m)}`<c.inicio)continue;
    const key=`${y}-${p2(m)}`,dmax=new Date(y,m,0).getDate(),aj=(c.ajustes||{})[key];
    out.push({key,ano:y,mes:m,data:aj||`${key}-${p2(Math.min(+c.dia||15,dmax))}`,ajustada:!!aj});}
  return out;
}
function slotInfo(key){if(!key)return null;const y=+key.slice(0,4);return slotsAno(y).find(s=>s.key===key)||{key,ano:y,mes:+key.slice(5,7),data:key+"-01"};}
function slotParaData(d){
  if(!d)return null;const y=+d.slice(0,4),m=+d.slice(5,7),st=passo();
  for(const yy of [y,y-1])for(const s of slotsAno(yy)){const idx=(y-s.ano)*12+(m-s.mes);if(idx>=0&&idx<st)return s.key;}
  for(const yy of [y,y+1])for(const s of slotsAno(yy)){const idx=(s.ano-y)*12+(s.mes-m);if(idx>=0&&idx<st)return s.key;}
  return null;
}
function statusSlot(s){
  const rs=list("reunioes").filter(r=>r.slot===s.key||(!r.slot&&slotParaData(r.data)===s.key)).sort((a,b)=>(a.status==="concluida"?0:1)-(b.status==="concluida"?0:1));
  const conc=rs.find(r=>r.status==="concluida");
  if(conc){const a=statusAssin(conc);return {st:"ok",txt:a.total&&!a.completa?"Realizada · em assinatura":"Realizada",r:conc,rs};}
  if(rs.length)return {st:"pri",txt:"Em preparação",r:rs[0],rs};
  if(s.data<hoje())return {st:"bad",txt:"Atrasada",rs};
  return {st:"none",txt:"Planejada",rs};
}
function proximaPrevista(){const y=new Date().getFullYear();return [...slotsAno(y),...slotsAno(y+1)].find(s=>{const x=statusSlot(s);return x.st!=="ok"&&s.data>=hoje();})||null;}
function freqTxt(){const c=calCfg();return `${FREQS[c.frequencia][0]} · a partir de ${MESES_LONGO[(+c.mesInicio||1)-1].toLowerCase()} · dia ${c.dia}${c.hora?` às ${c.hora}`:""}`;}
function viewCalendario(){
  const y=UI.calAno||new Date().getFullYear(),slots=slotsAno(y),bySlot={};slots.forEach(s=>bySlot[s.mes]=s);
  const sts=slots.map(statusSlot),cont={ok:0,pri:0,bad:0,none:0};sts.forEach(x=>cont[x.st]++);
  const vencidas=slots.filter((s,i)=>s.data<hoje()||sts[i].st==="ok").length;
  const pct=vencidas?Math.round(cont.ok/vencidas*100):null;
  const prox=proximaPrevista();
  const extras=list("reunioes").filter(r=>!r.slot&&!slotParaData(r.data)&&(r.data||"").startsWith(String(y)));
  const cards=Array.from({length:12},(_,k)=>{
    const m=k+1,s=bySlot[m],mk=`${y}-${p2(m)}`,ex=extras.filter(r=>r.data.slice(0,7)===mk);
    const exHtml=ex.map(r=>`<button class="cal-extra" data-open-reuniao="${r.id}">${ic("file")}${esc(r.titulo)}<small>Sem vínculo · ${fmtData(r.data)}</small></button>`).join("");
    if(!s)return `<div class="cal-mes off ${ex.length?"has-ex":""}"><div class="cal-top"><b>${MESES_LONGO[k]}</b></div><p class="cal-none">${mk<calCfg().inicio?"Antes do início do calendário":"Sem reunião prevista"}</p>${exHtml}</div>`;
    const x=statusSlot(s),isProx=prox&&prox.key===s.key;
    return `<div class="cal-mes ${x.st} ${isProx?"prox":""}"><div class="cal-top"><b>${MESES_LONGO[k]}</b>${isProx?`<span class="pill warn">${ic("flag")}Próxima</span>`:""}</div>
      <div class="cal-date"><span class="cal-dia">${s.data.slice(8,10)}</span><div><b>${fmtData(s.data)}</b><small>${esc(calCfg().hora||"")}${s.ajustada?" · reagendada":""}</small></div></div>
      <span class="pill ${x.st}">${ic(x.st==="ok"?"ok":x.st==="bad"?"alert":x.st==="pri"?"clock":"calendar")}${x.txt}</span>
      ${x.r?`<p class="cal-reu">${ic("file")}${esc(x.r.titulo)}${x.rs.length>1?` <small>+${x.rs.length-1}</small>`:""}</p>`:""}
      <div class="cal-btns">${x.r?`<button class="btn sm" data-open-reuniao="${x.r.id}" ${x.st==="ok"?`data-tab="ata"`:""}>${ic(x.st==="ok"?"file":"edit")}${x.st==="ok"?"Ver ata":"Abrir"}</button>`:`<button class="btn sm pri" data-cal-criar="${s.key}">${ic("plus")}Criar reunião</button><button class="btn sm" data-cal-realizada="${s.key}">${ic("check")}Concluir mês</button>`}${x.r&&x.r.status!=="concluida"?`<button class="btn sm pri" data-concluir="${x.r.id}">${ic("check")}Concluir mês</button>`:""}${x.st!=="ok"?`<button class="btn sm ghost" data-cal-reag="${s.key}">${ic("calendar")}Reagendar</button>`:""}${x.r?`<button class="icon-btn sm danger-ic" data-del-reuniao="${x.r.id}" title="Excluir reunião" aria-label="Excluir reunião">${ic("trash")}</button>`:""}</div>${exHtml}</div>`;
  }).join("");
  return `<div class="panel cal-bar"><div class="row"><button class="icon-btn" data-cal-ano="${y-1}" aria-label="Ano anterior">${ic("left")}</button><b class="cal-ano">${y}</b><button class="icon-btn" data-cal-ano="${y+1}" aria-label="Próximo ano">${ic("right")}</button>${y!==new Date().getFullYear()?`<button class="btn sm ghost" data-cal-ano="${new Date().getFullYear()}">Hoje</button>`:""}</div>
    <div class="row"><span class="small muted">${ic("calendar")} ${esc(freqTxt())} · início em ${fmtMes(calCfg().inicio)}</span><button class="btn sm" data-act="cal-config">${ic("edit")}Configurar calendário</button></div></div>
  <div class="kpis">
    <div class="kpi pri"><span class="kic">${ic("calendar")}</span><span>Previstas no ano</span><b>${slots.length}</b></div>
    <div class="kpi ok"><span class="kic">${ic("ok")}</span><span>Realizadas</span><b>${cont.ok}</b></div>
    <div class="kpi warn"><span class="kic">${ic("clock")}</span><span>Em preparação</span><b>${cont.pri}</b></div>
    <div class="kpi bad"><span class="kic">${ic("alert")}</span><span>Atrasadas</span><b>${cont.bad}</b></div>
    <div class="kpi ${pct==null?"pri":pct>=100?"ok":pct>=70?"warn":"bad"}"><span class="kic">${ic("target")}</span><span>Cumprimento até hoje</span><b>${pct==null?"—":pct+"%"}</b></div>
  </div>
  <div class="cal-grid">${cards}</div>
  <p class="small muted" style="margin-top:12px">${ic("info")} Ao concluir a ata, a reunião é vinculada automaticamente ao mês previsto correspondente à data da reunião. O vínculo pode ser ajustado na aba Dados da reunião.</p>`;
}
function modalCalConfig(){
  const c=calCfg();
  const prev=()=>{const f=document.querySelector(".modal [name=frequencia]").value,mi=+document.querySelector(".modal [name=mesInicio]").value,st=FREQS[f][1];return MESES.filter((_,k)=>(((k+1-mi)%st)+st)%st===0).join(", ");};
  openModal(`<h2>Calendário de análise crítica</h2><p class="small muted" style="margin:-8px 0 14px">Defina a periodicidade das reuniões. O calendário gera automaticamente os meses previstos de cada ano.</p>
  <div class="grid3">

const ENT_CURTO={acoesAnteriores:"Ações anteriores",contexto:"Contexto externo e interno",satisfacao:"Satisfação do cliente",objetivos:"Objetivos da qualidade",processos:"Desempenho dos processos",naoConformidades:"Não conformidades",monitoramento:"Monitoramento e medição",auditorias:"Auditorias",provedores:"Provedores externos",recursos:"Suficiência de recursos",riscos:"Riscos e oportunidades",melhoria:"Oportunidades de melhoria"};
const ENT_AUTO=[["satisfacao",/satisf|reclama|cliente|nps|elogio/],["processos",/produc|manuten|entrega|logist|prazo|refugo|retrabalho|receita|venda|comercial|process|produtiv/],["naoConformidades",/nao conform|refugo|retrabalho|reclama|defeito|corretiva|devoluc/],["auditorias",/auditor/],["provedores",/fornece|compra|suprim|provedor/],["recursos",/treina|absente|turnover|capacit|recursos humanos|\brh\b|orcament|equipament|manuten|horas/],["riscos",/acident|segur|risco|incidente|ambient/],["contexto",/receita|fatur|mercado/]];
function entradasDoInd(i){
  if(Array.isArray(i.entradas))return i.entradas;
  const t=norm(i.nome+" "+(i.processo||"")+" "+(i.formula||""));
  const out=["objetivos","monitoramento"];
  ENT_AUTO.forEach(([k,re])=>{if(re.test(t))out.push(k);});
  return out;
}
function indsDaEntrada(k){return list("indicadores").filter(i=>entradasDoInd(i).includes(k)).sort(sortInd);}

  const an=inds.filter(i=>String((r.analises||{})[i.id]||"").trim()).length;
  const auto=inds.length>0&&an===inds.length;
  return {ok:!!e.ok||auto,manual:!!e.ok,auto,inds,an,texto:e.texto||""};
}

/* ---------- Gráfico ampliado ---------- */
function modalGrafico(id,per,n0){
  const listaIds=(UI.view==="reuniao"&&S.reunioes[UI.reuniaoId]?indsFiltrados(S.reunioes[UI.reuniaoId].periodo):indsFiltrados()).map(i=>i.id);
  const st={id,per:per||UI.periodo,n:n0||(isMobile()?6:12)};
  const draw=()=>{
    const i=S.indicadores[st.id]; if(!i)return `<p>Indicador não encontrado.</p><div class="actions"><button class="btn" data-m="close">Fechar</button></div>`;
    const meses=ultimosMeses(st.per,st.n);
    const vals=meses.map(p=>({p,v:valorPeriodo(i,p)})).filter(x=>x.v!=null&&x.v!==""&&!isNaN(x.v)).map(x=>({p:x.p,v:+x.v}));
    const atual=valorPeriodo(i,st.per), sa=statusValor(i,atual);
    const media=vals.length?vals.reduce((a,b)=>a+b.v,0)/vals.length:null;
    const maior=i.sentido!=="menor";
    const melhor=vals.length?vals.reduce((a,b)=>(maior?b.v>a.v:b.v<a.v)?b:a):null;
    const pior=vals.length?vals.reduce((a,b)=>(maior?b.v<a.v:b.v>a.v)?b:a):null;
    const ating=vals.filter(x=>statusValor(i,x.v)==="ok").length;
    let tend="flat",tendTxt="Estável",tendCls="none";
    if(vals.length>=2){const k=vals.length, ult=vals.slice(-3), ant=vals.slice(0,Math.max(1,k-3));
      const mu=ult.reduce((a,b)=>a+b.v,0)/ult.length, ma=ant.reduce((a,b)=>a+b.v,0)/ant.length;
      const d=ma?((mu-ma)/Math.abs(ma)):0;
      if(Math.abs(d)>0.02){const sobe=d>0;tend=sobe?"up":"down";const bom=sobe===maior;tendCls=bom?"ok":"bad";tendTxt=(bom?"Melhorando":"Piorando")+` (${sobe?"+":""}${(d*100).toLocaleString("pt-BR",{maximumFractionDigits:1})}%)`;}
    }
    const pos=listaIds.indexOf(st.id);
    const u=esc(i.unidade||"");
    const stat=(icn,cls,lbl,val,sub)=>`<div class="zstat ${cls}"><span class="zic">${ic(icn)}</span><div><span>${lbl}</span><b>${val}</b>${sub?`<small>${sub}</small>`:""}</div></div>`;
    return `<div class="zhead"><div class="ind-name">${picto(i,sa)}<div><h2 style="margin:0">${esc(i.nome)}</h2><span class="small muted">${esc(i.processo||"—")} · ${esc(i.responsavel||"sem responsável")} · meta ${esc(metaTxt(i))} · tolerância ${fmtNum(i.tolerancia||0)}%</span></div></div>
      <div class="row">${botaoAcoes(i)}<button class="icon-btn" data-m="fsnav" aria-label="Tela cheia do navegador" title="${document.fullscreenElement?"Sair da tela cheia do navegador":"Tela cheia do navegador"}">${ic(document.fullscreenElement?"recolher":"expand")}</button><button class="icon-btn" data-m="close" aria-label="Fechar" title="Fechar (Esc)">${ic("x")}</button></div></div>
    <div class="zstats">
      ${stat(ST_ICON[sa],sa,`Resultado ${fmtMes(st.per)}`,`${fmtNum(atual)} <small>${u}</small>`,ST_LABEL[sa])}
      ${stat("target","pri","Meta",`${fmtNum(i.meta)} <small>${u}</small>`,maior?"Maior é melhor":"Menor é melhor")}
      ${stat("avg","none","Média do período",media==null?"—":`${fmtNum(Math.round(media*100)/100)} <small>${u}</small>`,`${vals.length} meses com dado`)}
      ${stat("trophy","ok","Melhor resultado",melhor?`${fmtNum(melhor.v)} <small>${u}</small>`:"—",melhor?fmtMes(melhor.p):"")}
      ${stat("flag","bad","Pior resultado",pior?`${fmtNum(pior.v)} <small>${u}</small>`:"—",pior?fmtMes(pior.p):"")}
      ${stat(tend,tendCls,"Tendência",vals.length?`${ating}/${vals.length} <small>na meta</small>`:"—",tendTxt)}
    </div>
    <div class="row" style="justify-content:space-between;margin:10px 0 6px"><div class="seg" role="group" aria-label="Janela de meses">${[6,12,24].map(n=>`<button class="${st.n===n?"on":""}" data-m="n${n}">${n} meses</button>`).join("")}</div>
      <label class="f" style="flex-direction:row;align-items:center;gap:8px">${ic("calendar")}<input type="month" id="zper" value="${st.per}" style="width:auto"></label></div>
    <div class="zchart" id="zchart"></div>
    ${LEGENDA}
    <div class="scroll" style="margin-top:12px"><table class="ztable"><thead><tr><th>Mês</th>${meses.map(p=>`<th class="${p===st.per?"cur":""}">${fmtMes(p)}</th>`).join("")}</tr></thead><tbody><tr><td><b>Resultado</b></td>${meses.map(p=>{const v=valorPeriodo(i,p);const s2=statusValor(i,v);return `<td class="zc ${s2} ${p===st.per?"cur":""}">${s2==="none"?"—":`${ic(ST_ICON[s2])}${fmtCompact(v)}`}</td>`;}).join("")}</tr></tbody></table></div>
    <div class="actions" style="justify-content:space-between">
      <div class="row"><button class="btn" data-m="prev" ${pos<=0?"disabled":""}>${ic("left")}Anterior</button><button class="btn" data-m="next" ${pos<0||pos>=listaIds.length-1?"disabled":""}>Próximo${ic("right")}</button>${listaIds.length>1&&pos>=0?`<span class="small muted">${pos+1} de ${listaIds.length}</span>`:""}</div>
      <div class="row"><button class="btn" data-m="lancar">${ic("table")}Lançar resultados</button><button class="btn" data-m="acao">${ic("target")}Definir ação</button><button class="btn pri" data-m="close">Fechar</button></div>
    </div>`;
  };
  const fit=root=>{const box=root.querySelector("#zchart");const i=S.indicadores[st.id];if(!box||!i)return;
    const w=Math.max(320,box.clientWidth-12),h=Math.max(220,box.clientHeight-14);
    const F=Math.max(1,Math.min(1.6,w/800));
    box.innerHTML=chartSVG(i,ultimosMeses(st.per,st.n),null,st.per,{W:w,H:h,F});};
  const redraw=root=>{root.innerHTML=draw();bindZ(root);permGuard(root);};
  const bindZ=root=>{const z=root.querySelector("#zper");if(z)z.addEventListener("change",e=>{if(e.target.value){st.per=e.target.value;redraw(root);}});requestAnimationFrame(()=>fit(root));};
  zoomFit=()=>{const m=document.querySelector(".modal.lg");if(m)fit(m);};
  const voltar=()=>modalGrafico(st.id,st.per,st.n);
  openModal(draw(),(act,root)=>{
    if(act==="n6"||act==="n12"||act==="n24"){st.n=+act.slice(1);redraw(root);}
    else if(act==="prev"||act==="next"){const pos=listaIds.indexOf(st.id);const np=pos+(act==="next"?1:-1);if(listaIds[np]){st.id=listaIds[np];redraw(root);}}
    else if(act==="fsnav"){(async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){toast("A tela cheia do navegador não está disponível aqui.");}redraw(root);})();}
    else if(act==="acoes"){closeModal(true);modalAcoesInd(st.id);modalStack.push(voltar);}
    else if(act==="lancar"){const id=st.id;closeModal(true);modalLancar(id);modalStack.push(voltar);}
    else if(act==="acao"){const i=S.indicadores[st.id];const v=valorPeriodo(i,st.per);const reu=UI.view==="reuniao"?UI.reuniaoId:"";closeModal(true);
      modalAcao(null,{indicadorId:i.id,reuniaoId:reu||"",quem:i.responsavel||"",porque:`${i.nome}: resultado ${fmtNum(v)} ${i.unidade||""} em ${fmtMes(st.per)} (meta ${metaTxt(i)}).`});modalStack.push(voltar);}
  },bindZ,"lg");
}

function botaoAcoes(i){
  const todas=acoesDoInd(i.id), ab=todas.filter(a=>a.status==="aberta"||a.status==="andamento"), atr=ab.filter(acaoAtrasada).length;

/* ---------- Modal ---------- */
let modalHandler=null;
function openModal(html,onAction,onMount,cls){
  modalOpen=true; modalHandler=onAction;
  const root=document.getElementById("modal-root");
  root.innerHTML=`<div class="modal-bg ${cls==="lg"?"center":""}"><div class="modal ${cls||""}" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;
  const m=root.querySelector(".modal");
  if(onMount)onMount(m);
  permGuard(m);
  const first=cls?null:m.querySelector("input,select,textarea"); if(first)first.focus(); else m.focus();
}
let modalStack=[], zoomFit=null;
function closeModal(semRetorno){modalOpen=false;modalHandler=null;document.getElementById("modal-root").innerHTML="";render();
  if(!semRetorno){const r=modalStack.pop();if(r)r();}}
window.addEventListener("resize",()=>{if(zoomFit&&document.querySelector(".modal.lg"))zoomFit();});
document.addEventListener("fullscreenchange",()=>{if(zoomFit&&document.querySelector(".modal.lg"))setTimeout(zoomFit,50);});
document.getElementById("modal-root").addEventListener("click",e=>{
  if(e.target.classList.contains("modal-bg")){closeModal();return;}
  const b=e.target.closest("[data-m]"); if(!b)return;
  if(b.dataset.m==="close"){closeModal();return;}
  if(modalHandler)modalHandler(b.dataset.m,document.querySelector("#modal-root .modal"));
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modalOpen)closeModal();});
function formData(root){const o={};root.querySelectorAll("[name]").forEach(el=>{o[el.name]=el.value;});return o;}
