  const lf=m.querySelector("#logoFile");
  if(lf)lf.addEventListener("change",async()=>{if(!pode("empresa",2))return;try{const url=await carregarLogo(lf.files[0]);await put("config",{...cfg(),id:"geral",logo:url});toast("Logomarca salva");render();}catch(e){toast(e.message==="grande"?"Arquivo muito grande (máximo 8 MB).":e.message==="tipo"?"Envie uma imagem PNG, JPG, SVG ou WEBP.":"Não foi possível ler a imagem.");}});
  m.querySelectorAll("[data-cfg]").forEach(el=>el.addEventListener("input",()=>{const c={...cfg()};c[el.dataset.cfg]=el.value;debounceSave("config",c);}));
  const r=S.reunioes[UI.reuniaoId];
  if(UI.view==="reuniao"&&r){
    m.querySelectorAll("[data-r]").forEach(el=>{el.addEventListener("input",()=>{r[el.dataset.r]=el.value;debounceSave("reunioes",r);});});
    m.querySelectorAll("[data-part]").forEach(el=>el.addEventListener("change",()=>{const s=new Set(r.participantesIds||[]);el.checked?s.add(el.dataset.part):s.delete(el.dataset.part);r.participantesIds=[...s];debounceSave("reunioes",r,100);}));
    m.querySelectorAll("[data-ent]").forEach(el=>el.addEventListener("input",()=>{r.entradas=r.entradas||{};const k=el.dataset.ent;r.entradas[k]={...(r.entradas[k]||{}),texto:el.value};debounceSave("reunioes",r);}));
    m.querySelectorAll("[data-entok]").forEach(el=>el.addEventListener("change",()=>{r.entradas=r.entradas||{};const k=el.dataset.entok;r.entradas[k]={...(r.entradas[k]||{}),ok:el.checked};debounceSave("reunioes",r,100);}));
    m.querySelectorAll("[data-anal]").forEach(el=>el.addEventListener("input",()=>{r.analises=r.analises||{};r.analises[el.dataset.anal]=el.value;debounceSave("reunioes",r);}));
    m.querySelectorAll("[data-sai]").forEach(el=>el.addEventListener("input",()=>{r.saidas=r.saidas||{};r.saidas[el.dataset.sai]=el.value;debounceSave("reunioes",r);}));
  }
}
document.getElementById("main").addEventListener("focusout",e=>{if(e.target.id==="busca")return;setTimeout(()=>{const a=document.activeElement;if(!a||a===document.body)scheduleRender();},50);});
document.getElementById("main").addEventListener("click",async e=>{
  const z=e.target.closest("[data-zoom]");
  if(z&&!e.target.closest("button")){modalGrafico(z.dataset.zoom,z.dataset.per);return;}
  const t=e.target.closest("button,tr.click"); if(!t)return;
  const d=t.dataset;
  if(d.act==="novo-ind")modalIndicador();
  else if(d.act==="exemplo")carregarExemplo();
  else if(d.act==="nova-reuniao")novaReuniao();
  else if(d.act==="nova-acao")modalAcao();
  else if(d.act==="novo-func")modalFunc();
  else if(d.act==="csv")exportarCSV();
  else if(d.act==="toggle-filtros"){UI.filtrosAbertos=!UI.filtrosAbertos;render();}
  else if(d.act==="cal-config")modalCalConfig();
  else if(d.reutab){UI.reuTab=d.reutab;render();}
  else if(d.calAno){UI.calAno=+d.calAno;render();}
  else if(d.calReag)modalReagendar(d.calReag);
  else if(d.calRealizada){if(pode("reunioes",2))await registrarRealizada(d.calRealizada);}
  else if(d.calCriar){const sl=slotInfo(d.calCriar);await novaReuniao({data:sl.data,slot:sl.key});toast(`Reunião criada para ${fmtData(sl.data)}`);}
  else if(d.act==="del-logo"){if(pode("empresa",2)&&confirm("Remover a logomarca?")){const c={...cfg(),id:"geral"};delete c.logo;await put("config",c);toast("Logomarca removida");render();}}
  else if(d.act==="relatorio")baixarRelatorio();
  else if(d.act==="limpar-filtros"){UI.fProc=UI.fInd=UI.fSit=UI.busca="";render();}
  else if(d.act==="part-todos"||d.act==="part-nenhum"){const r=S.reunioes[UI.reuniaoId];r.participantesIds=d.act==="part-todos"?funcs(true).map(f=>f.id):[];await put("reunioes",r);render();}
  else if(d.act==="toggle-status"){const r=S.reunioes[UI.reuniaoId];if(r.status==="concluida")await reabrirReuniao(r);else await concluirReuniao(r);}
  else if(d.act==="del-reuniao")await excluirReuniao(UI.reuniaoId);
  else if(d.delReuniao)await excluirReuniao(d.delReuniao);
  else if(d.concluir){const r=S.reunioes[d.concluir];if(r&&r.status!=="concluida"&&pode("reunioes",2))await concluirReuniao(r);}
  else if(d.act==="baixar-ata")baixarAta();
  else if(d.act==="copiar-ata")copiarAta();
  else if(d.modo){UI.indModo=d.modo;render();}
  else if(d.analisar)modalAnalise(d.analisar);
  else if(d.zoombtn){const r=S.reunioes[UI.reuniaoId];modalGrafico(d.zoombtn,r?r.periodo:UI.periodo);}
  else if(d.vincular)modalVincular(d.vincular);
  else if(d.obs){UI.obsAberta=UI.obsAberta||{};UI.obsAberta[d.obs]=true;render();const ta=document.getElementById("ent-"+d.obs);if(ta)ta.focus();}
  else if(d.editInd)modalIndicador(d.editInd);
  else if(d.editFunc)modalFunc(d.editFunc);
  else if(d.lancar)modalLancar(d.lancar);
  else if(d.editAcao)modalAcao(d.editAcao);
  else if(d.assinar)modalAssinar(d.assinar);
  else if(d.openReuniao){UI.reuniaoId=d.openReuniao;UI.reuniaoTab=d.tab||"dados";UI.view="reuniao";render();window.scrollTo(0,0);}
  else if(d.rtab){UI.reuniaoTab=d.rtab;render();}
  else if(d.facao){UI.filtroAcao=d.facao;render();}
  else if(d.novaAcaoInd){const i=S.indicadores[d.novaAcaoInd];const r=S.reunioes[UI.reuniaoId];const v=valorPeriodo(i,r.periodo);
    modalAcao(null,{indicadorId:i.id,reuniaoId:r.id,porque:`${i.nome}: resultado ${fmtNum(v)} ${i.unidade||""} em ${fmtMes(r.periodo)} (meta ${metaTxt(i)}).`,quem:i.responsavel||""});}
  else if(d.novaAcaoReu)modalAcao(null,{reuniaoId:UI.reuniaoId});
});

/* ---------- Exportações ---------- */
async function salvarArquivo(nome,conteudo){
  if(downloads){
    try{await downloads.save({filename:nome,data:conteudo});toast("Arquivo salvo");}
    catch(e){if(e&&e.code!=="declined")toast("Não foi possível salvar o arquivo aqui.");}
    return;
  }
  try{
    const url=URL.createObjectURL(new Blob([conteudo],{type:nome.endsWith(".csv")?"text/csv":"text/html"}));
    const a=document.createElement("a");a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){toast("Download indisponível nesta visualização.");}
}
function exportarCSV(){
  const cols=["O quê","Por quê","Onde","Quem","Quando","Como","Quanto","Indicador","Reunião","Outra origem","Situação","Eficácia","Acompanhamento"];
  const q=s=>`"${String(s==null?"":s).replace(/"/g,'""')}"`;
  const rows=list("acoes").map(a=>[a.oque,a.porque,a.onde,a.quem,fmtData(a.quando),a.como,a.quanto,(S.indicadores[a.indicadorId]||{}).nome,(S.reunioes[a.reuniaoId]||{}).titulo,a.origemOutro,acaoAtrasada(a)?"Atrasada":STATUS_ACAO[a.status],a.status==="concluida"?EFICACIA[a.eficacia||"pendente"]:"",a.comentario].map(q).join(";"));
  salvarArquivo(`plano-de-acao-${hoje()}.csv`,"\uFEFF"+[cols.map(q).join(";"),...rows].join("\r\n"));
}
function relatorioHtml(){
  const c=cfg(),per=UI.periodo,inds=indsFiltrados(),meses=ultimosMeses(per,12),f=eu();
  const cont={ok:0,warn:0,bad:0,none:0};inds.forEach(i=>cont[statusValor(i,valorPeriodo(i,per))]++);
  const ids=new Set(inds.map(i=>i.id));
  const acs=list("acoes").filter(a=>ids.has(a.indicadorId)&&(a.status==="aberta"||a.status==="andamento"));
  const filtros=[UI.fProc&&`processo ${UI.fProc}`,UI.fInd&&S.indicadores[UI.fInd]&&`indicador ${S.indicadores[UI.fInd].nome}`,UI.fSit&&`situação ${ST_LABEL[UI.fSit]}`,UI.busca&&`busca "${UI.busca}"`].filter(Boolean);
  let n=0;const sec=t=>`<h2>${++n}. ${t}</h2>`;
  const cor={ok:["#E6F4EC","#1E7B4A"],warn:["#FDF2E0","#B26B00"],bad:["#FDECEA","#B42318"],none:["#F2F4F7","#98A2B3"]};
  return `<div class="ata-doc">
  <table class="hd"><tbody><tr><td class="logo img" rowspan="2"><img src="${LOGO_N}" alt="Partner"></td><td class="tt" rowspan="2">RELATÓRIO DE INDICADORES DO SISTEMA DE GESTÃO<small>${esc(c.empresa||"Sistema de Gestão da Qualidade")}</small></td><td class="cd"><b>Período:</b> ${fmtMes(per)}<br><b>Emissão:</b> ${fmtData(hoje())}</td></tr><tr><td class="cd"><b>Emitido por:</b><br>${esc(f?f.nome:"—")}</td></tr></tbody></table>
  ${filtros.length?`<p style="font-size:11px;color:#667085;margin-top:8px">Filtros aplicados: ${esc(filtros.join(" · "))}</p>`:""}
  ${sec("Resumo do período")}
  <div class="resumo"><div><b>${inds.length}</b>Indicadores</div><div><b style="color:#1E7B4A">${cont.ok}</b>Meta atingida</div><div><b style="color:#B26B00">${cont.warn}</b>Em alerta</div><div><b style="color:#B42318">${cont.bad}</b>Não atingida</div><div><b style="color:#667085">${cont.none}</b>Sem resultado</div><div><b>${acs.length}</b>Ações em aberto</div></div>
  ${sec(`Situação dos indicadores — ${fmtMes(per)}`)}
  <div class="tw"><table><thead><tr><th>Indicador</th><th>Processo</th><th>Responsável</th><th>Meta</th><th>Resultado</th><th>Situação</th></tr></thead><tbody>${inds.map(i=>{const v=valorPeriodo(i,per),st=statusValor(i,v);return `<tr><td><b>${esc(i.nome)}</b></td><td>${esc(i.processo||"")}</td><td>${esc(i.responsavel||"")}</td><td style="white-space:nowrap">${esc(metaTxt(i))}</td><td style="white-space:nowrap">${fmtNum(v)} ${v!=null?esc(i.unidade||""):""}</td><td><span class="st ${st}">${ST_LABEL[st]}</span></td></tr>`;}).join("")||`<tr><td colspan="6" class="vazio">Nenhum indicador.</td></tr>`}</tbody></table></div>
  ${sec("Semáforo dos últimos 12 meses")}
  <div class="tw"><table><thead><tr><th>Indicador</th>${meses.map(p=>`<th style="text-align:center">${fmtMes(p)}</th>`).join("")}</tr></thead><tbody>${inds.map(i=>`<tr><td><b>${esc(i.nome)}</b></td>${meses.map(p=>{const v=valorPeriodo(i,p),st=statusValor(i,v);return `<td style="text-align:center;background:${cor[st][0]};color:${cor[st][1]};font-weight:600;white-space:nowrap">${st==="none"?"·":fmtCompact(v)}</td>`;}).join("")}</tr>`).join("")}</tbody></table></div>
  ${sec("Gráficos")}
  <div class="charts">${inds.map(i=>`<div class="chart"><b>${esc(i.nome)}</b><small>${esc(i.processo||"")} · meta ${esc(metaTxt(i))}</small>${chartSVG(i,meses,HEX,per)}</div>`).join("")}</div>
  <p style="font-size:10.5px;color:#667085;margin-top:6px">Barras verdes: meta atingida · âmbar: dentro da tolerância · vermelhas: meta não atingida · linha tracejada: meta · faixa clara: tolerância.</p>
  ${sec("Ações em aberto")}
  ${tabelaAtaAcoes(acs)}
  <div class="foot"><span>${esc(c.empresa||"")}</span><span>Relatório gerado em ${fmtDataHora(new Date().toISOString())}</span></div>
  </div>`;
}
function baixarRelatorio(){
  const doc=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relatório de indicadores — ${fmtMes(UI.periodo)}</title><style>body{margin:0;padding:24px 12px;background:#F4F6F9;font-family:Inter,"Segoe UI",Arial,sans-serif}.bar{max-width:900px;margin:0 auto 12px;text-align:right}.bar button{background:#1F4E79;color:#fff;border:0;border-radius:6px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}@page{size:A4 landscape;margin:12mm}@media print{body{padding:0;background:#fff}.bar{display:none}}${ATA_CSS}</style></head><body><div class="bar"><button onclick="window.print()">Imprimir / salvar PDF</button></div>${relatorioHtml()}</body></html>`;
  salvarArquivo(`relatorio-indicadores-${UI.periodo}.html`,doc);
}
function baixarAta(){
  const r=S.reunioes[UI.reuniaoId];
  const doc=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ata ${esc(r.numero||"")} — ${esc(r.titulo)}</title><style>body{margin:0;padding:24px 12px;background:#F4F6F9;font-family:Inter,"Segoe UI",Arial,sans-serif}.bar{max-width:900px;margin:0 auto 12px;text-align:right}.bar button{background:#1F4E79;color:#fff;border:0;border-radius:6px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}@page{size:A4;margin:14mm}@media print{body{padding:0;background:#fff}.bar{display:none}}${ATA_CSS}</style></head><body><div class="bar"><button onclick="window.print()">Imprimir / salvar PDF</button></div>${ataHtml(r)}</body></html>`;
  salvarArquivo(`ata-${(r.numero||r.data||hoje()).replace(/\//g,"-")}.html`,doc);
}
async function copiarAta(){
  const el=document.querySelector(".ata-doc"); if(!el)return;
  try{await navigator.clipboard.writeText(el.innerText);toast("Texto da ata copiado");}catch(e){toast("Não foi possível copiar. Selecione o texto e copie manualmente.");}
}

/* ---------- Exemplo (somente quando o usuário pede) ---------- */
async function carregarExemplo(){
  const meses=ultimosMeses(UI.periodo,8);
  const mk=(nome,processo,responsavel,unidade,meta,sentido,tol,base,var_)=>{
    const res={};meses.forEach((p,k)=>{res[p]=Math.round((base+Math.sin(k*1.3)*var_+(k-4)*var_*0.15)*10)/10;});
    return {id:uid(),nome,processo,responsavel,unidade,meta,sentido,tolerancia:tol,frequencia:"Mensal",formula:"",resultados:res,criadoEm:new Date().toISOString()};
  };
  const ex=[
    mk("Satisfação do cliente","Comercial","Gerente comercial","%",85,"maior",5,84,4),
    mk("Entregas no prazo","Logística","Coordenador de logística","%",95,"maior",3,93,3),
    mk("Índice de refugo","Produção","Supervisor de produção","%",2,"menor",25,2.2,.5),
    mk("Reclamações de clientes","Qualidade","Analista da qualidade","un",5,"menor",20,5,2),
    mk("Horas de treinamento por colaborador","RH","Analista de RH","h",4,"maior",10,3.8,1),
    mk("Fornecedores qualificados","Compras","Comprador","%",90,"maior",5,91,3)
  ];
  for(const i of ex)await put("indicadores",i);
  render(); toast("Indicadores de exemplo carregados");
}
